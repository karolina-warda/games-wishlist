name: "games-wishlist-job: Build and Push"
on:
  push:
    branches:
      - master
    paths:
      - main.py
      - requirements.txt
      - Dockerfile
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Generate Image Tag
        id: generate_tag
        run: |
          today=$(date +'%Y.%m.%d')
          tag="$today.${{ github.run_number }}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: "linux/amd64"
          context: "{{defaultContext}}"
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/games-wishlist-job:${{ steps.generate_tag.outputs.tag }},${{ vars.DOCKERHUB_USERNAME }}/games-wishlist-job:latest
